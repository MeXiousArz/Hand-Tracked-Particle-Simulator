<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand-Tracked-Particle-Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #00ffff;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        #video-container {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 180px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 12px;
            overflow: hidden;
            transform: scaleX(-1);
            opacity: 0.5;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .label {
            color: #ff00ff;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="ui">
        <h2 style="margin:0;">Core: <span id="shape-name" class="label">Sphere</span></h2>
        <p id="status-text" style="font-size: 0.8em; margin-top: 5px;">Awaiting for Gesture...</p>
        <div style="font-size: 0.7em; opacity: 0.6; margin-top: 20px;">
            [Left/Right Hand] -> Control Rotation<br>
            [Pinch] -> Hyper-Expansion<br>
            [Two Hand Clap] -> Shift Geometry
        </div>
    </div>

    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        // --- Core Variables ---
        const PARTICLE_COUNT = 20000;
        let shapeIndex = 0;
        // UPDATED SHAPE LIST
        const shapes = ['sphere', 'heart', 'saturn', 'flower', 'spring', 'butterfly', 'dragon', 'firework', 'dna', 'galaxy'];
        let isTransitioning = false;
        let transitionFactor = 0;
        let canSwitch = true;

        let targetRotX = 0, targetRotY = 0;
        let pinchScale = 1;
        let isHandDetected = false;

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7; // Moved camera back slightly for larger shapes

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloom.strength = 1.5;
        composer.addPass(bloom);

        // --- Particles ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 10;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 10;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.015, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // --- Shape Geometry Generators ---
        function setShape(type) {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                let x, y, z;
                let p = i / PARTICLE_COUNT;
                let t = p * Math.PI * 2;
                let u = Math.random() * Math.PI * 2;
                let v = Math.random() * Math.PI;

                if (type === 'sphere') {
                    x = 2 * Math.sin(v) * Math.cos(u);
                    y = 2 * Math.sin(v) * Math.sin(u);
                    z = 2 * Math.cos(v);
                }
                else if (type === 'heart') {
                    const phi = i * 0.1;
                    x = 0.18 * (16 * Math.pow(Math.sin(phi), 3));
                    y = 0.18 * (13 * Math.cos(phi) - 5 * Math.cos(2 * phi) - 2 * Math.cos(3 * phi) - Math.cos(4 * phi));
                    z = (Math.random() - 0.5) * 0.5;
                } else if (type === 'saturn') {
                    if (i < PARTICLE_COUNT * 0.4) {
                        x = 1.2 * Math.sin(v) * Math.cos(u); y = 1.2 * Math.sin(v) * Math.sin(u); z = 1.2 * Math.cos(v);
                    } else {
                        const r = 2.4 + Math.random() * 0.6;
                        x = r * Math.cos(t); y = r * Math.sin(t) * 0.2; z = r * Math.sin(t);
                    }
                } else if (type === 'flower') {
                    const r = 2.5 * Math.sin(5 * t);
                    x = r * Math.cos(t); y = r * Math.sin(t); z = (Math.random() - 0.5) * 0.5;
                } else if (type === 'firework') {
                    const r = Math.pow(Math.random(), 0.5) * 4.5;
                    x = r * Math.sin(v) * Math.cos(u); y = r * Math.sin(v) * Math.sin(u); z = r * Math.sin(v);
                } else if (type === 'spring') {
                    const coils = 20; const radius = 1.5; const height = 8;
                    const angle = p * Math.PI * 2 * coils;
                    const rJitter = radius + (Math.random() - 0.5) * 0.3;
                    x = rJitter * Math.cos(angle); y = (p - 0.5) * height; z = rJitter * Math.sin(angle);
                } else if (type === 'butterfly') {
                    const theta = p * Math.PI * 2 * 4;
                    let r = Math.exp(Math.sin(theta)) - 2 * Math.cos(4 * theta) + Math.pow(Math.sin((2 * theta - Math.PI) / 24), 5);
                    r *= 1.2; x = r * Math.cos(theta); y = r * Math.sin(theta) * 0.8; z = (Math.random() - 0.5) * 0.5;
                } else if (type === 'dragon') {
                    if (p < 0.85) {
                        const bodyP = p / 0.85; const pathX = (bodyP - 0.5) * 8;
                        const pathY = Math.sin(bodyP * Math.PI * 6) * 1.5; const pathZ = Math.cos(bodyP * Math.PI * 3) * 1.0;
                        const bodyRadius = 0.1 + (bodyP * 0.7) + Math.random() * 0.2;
                        x = pathX + bodyRadius * Math.cos(u); y = pathY + bodyRadius * Math.sin(u); z = pathZ + bodyRadius * (Math.random() - 0.5);
                    } else {
                        const fireP = (p - 0.85) / 0.15; const spread = fireP * 2.5;
                        x = 4 + fireP * 5 + Math.random(); y = (Math.random() - 0.5) * spread; z = (Math.random() - 0.5) * spread;
                    }
                }
                // --- NEW SHAPES: DNA & GALAXY ---
                else if (type === 'dna') {
                    const height = 10;
                    const turns = 3;
                    const radius = 1.8;
                    // Split: 40% strand A, 40% strand B, 20% rungs
                    if (p < 0.4) {
                        const pStrand = p / 0.4;
                        const angle = pStrand * Math.PI * 2 * turns;
                        x = radius * Math.cos(angle);
                        y = (pStrand - 0.5) * height;
                        z = radius * Math.sin(angle);
                    } else if (p < 0.8) {
                        const pStrand = (p - 0.4) / 0.4;
                        const angle = pStrand * Math.PI * 2 * turns + Math.PI;
                        x = radius * Math.cos(angle);
                        y = (pStrand - 0.5) * height;
                        z = radius * Math.sin(angle);
                    } else {
                        const pRung = (p - 0.8) / 0.2;
                        const rungStep = Math.floor(pRung * (turns * 12)) / (turns * 12);
                        const angle = rungStep * Math.PI * 2 * turns;
                        const lerp = (Math.random() * 2 - 1) * radius;
                        x = lerp * Math.cos(angle);
                        y = (rungStep - 0.5) * height;
                        z = lerp * Math.sin(angle);
                    }
                } else if (type === 'galaxy') {
                    const arms = 4;
                    const armStrength = 3.5;
                    const radius = 6;
                    const armIndex = i % arms;
                    const dist = Math.pow(Math.random(), 0.5) * radius;
                    const angle = (dist * armStrength) + (armIndex * (Math.PI * 2 / arms));
                    const spread = (1 / (dist + 1)) * 1.5;
                    x = Math.cos(angle) * dist + (Math.random() - 0.5) * spread;
                    y = (Math.random() - 0.5) * 0.4; // Flat disk effect
                    z = Math.sin(angle) * dist + (Math.random() - 0.5) * spread;
                }

                targetPositions[i * 3] = x;
                targetPositions[i * 3 + 1] = y;
                targetPositions[i * 3 + 2] = z;
            }
            document.getElementById('shape-name').innerText = type;
        }
        setShape('sphere');

        // --- AI Tracking Engine ---
        let handLandmarker;
        let lastHandTime = -1;

        async function initAI() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task` },
                runningMode: "VIDEO", numHands: 2
            });
            startWebcam();
        }

        async function startWebcam() {
            const video = document.getElementById('webcam');
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.onloadeddata = predict;
        }

        async function predict() {
            const video = document.getElementById('webcam');
            if (lastHandTime !== video.currentTime) {
                lastHandTime = video.currentTime;
                const results = handLandmarker.detectForVideo(video, performance.now());

                if (results.landmarks && results.landmarks.length > 0) {
                    isHandDetected = true;
                    const hand1 = results.landmarks[0];

                    targetRotY = (hand1[9].x - 0.5) * Math.PI * 2.5;
                    targetRotX = (hand1[9].y - 0.5) * Math.PI * 1.5;

                    const pinchDist = Math.hypot(hand1[4].x - hand1[8].x, hand1[4].y - hand1[8].y);
                    pinchScale = THREE.MathUtils.mapLinear(pinchDist, 0.03, 0.2, 4.0, 1.0);
                    pinchScale = THREE.MathUtils.clamp(pinchScale, 1.0, 4.0);

                    if (results.landmarks.length === 2 && canSwitch) {
                        const h1 = results.landmarks[0][9];
                        const h2 = results.landmarks[1][9];
                        const handGap = Math.hypot(h1.x - h2.x, h1.y - h2.y);

                        if (handGap < 0.12) {
                            triggerVortexTransition();
                        }
                    }
                    document.getElementById('status-text').innerText = `Neural Link: ${results.landmarks.length} Hand(s)`;
                } else {
                    isHandDetected = false;
                    document.getElementById('status-text').innerText = "Neural Link: Searching...";
                }
            }
            requestAnimationFrame(predict);
        }

        function triggerVortexTransition() {
            if (isTransitioning) return;
            isTransitioning = true;
            canSwitch = false;

            setTimeout(() => {
                shapeIndex = (shapeIndex + 1) % shapes.length;
                setShape(shapes[shapeIndex]);
                isTransitioning = false;
                setTimeout(() => { canSwitch = true; }, 1500);
            }, 1000);
        }

        // --- Main Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (isHandDetected) {
                const pos = geometry.attributes.position.array;
                const cols = geometry.attributes.color.array;
                const time = Date.now() * 0.001;

                points.rotation.y = THREE.MathUtils.lerp(points.rotation.y, targetRotY, 0.07);
                points.rotation.x = THREE.MathUtils.lerp(points.rotation.x, targetRotX, 0.07);

                transitionFactor = THREE.MathUtils.lerp(transitionFactor, isTransitioning ? 1 : 0, 0.08);

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    const ix = i * 3, iy = i * 3 + 1, iz = i * 3 + 2;

                    let tx = targetPositions[ix] * pinchScale;
                    let ty = targetPositions[iy] * pinchScale;
                    let tz = targetPositions[iz] * pinchScale;

                    if (transitionFactor > 0.05) {
                        const swirl = transitionFactor * 15;
                        const s = 1 - transitionFactor;
                        tx = (tx * Math.cos(swirl) - tz * Math.sin(swirl)) * s;
                        tz = (tx * Math.sin(swirl) + tz * Math.cos(swirl)) * s;
                        ty *= s;
                    }

                    pos[ix] += (tx - pos[ix]) * 0.1;
                    pos[iy] += (ty - pos[iy]) * 0.1;
                    pos[iz] += (tz - pos[iz]) * 0.1;

                    if (transitionFactor > 0.8) {
                        cols[ix] = cols[iy] = cols[iz] = 1.0;
                    } else {
                        cols[ix] = 0.4 + 0.6 * Math.sin(time + pos[ix] * 0.2);
                        cols[iy] = 0.3 + 0.5 * Math.cos(time + pos[iy] * 0.3);
                        cols[iz] = 0.9;
                    }
                }

                geometry.attributes.position.needsUpdate = true;
                geometry.attributes.color.needsUpdate = true;
                bloom.strength = 1.5 + transitionFactor * 4;
            }

            composer.render();
        }

        initAI();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
